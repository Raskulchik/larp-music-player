[package]
name = "larp-music-player"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
rodio = "0.20"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-stream = "0.1"
futures-util = "0.3"
urlencoding = "2"
serde-xml-rs = "0.8"
md5 = "0.7"
regex = "1"
mpris-server = { version = "0.10", features = ["tokio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
discord-rich-presence = "1.1"
lofty = "0.25"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
